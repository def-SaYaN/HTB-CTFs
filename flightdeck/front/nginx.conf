user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    server_tokens off;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/flightdeck;
        index index.html;

        # First breadcrumb: host-based enumeration should find flightdeck.ai.
        add_header X-Canonical-Host "flightdeck.ai" always;

        location = /robots.txt {
            default_type text/plain;
        }

        # Proxy the MCP JSON-RPC server. Players drive this with curl.
        location /mcp {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 8080;
        server_name flightdeck.ai www.flightdeck.ai;
        root /var/www/flightdeck-ai;
        index index.html;

        add_header X-Portal-State "stale" always;
        add_header X-AI-Gateway "legacy-assistant" always;

        location = /robots.txt {
            default_type text/plain;
        }

        location = /login {
            add_header Content-Type text/plain;
            return 401 "Invalid username or password\n";
        }

        location /mcp {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
