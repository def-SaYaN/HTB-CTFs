[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stdout_logfile=/var/log/sshd.out.log
stderr_logfile=/var/log/sshd.err.log
priority=10

[program:mcp]
command=/usr/bin/python3 /opt/flightdeck/mcp/server.py
environment=MCP_PORT="9000",FLIGHTDECK_SECRETS="/opt/flightdeck/secrets.env"
autostart=true
autorestart=true
stdout_logfile=/var/log/mcp.out.log
stderr_logfile=/var/log/mcp.err.log
priority=20

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.out.log
stderr_logfile=/var/log/nginx.err.log
priority=30

[program:sslh]
; Single exposed port trick: HTTP and SSH share container :80.
; HTTP is forwarded to nginx on 127.0.0.1:8080, SSH to sshd on 127.0.0.1:22.
command=/usr/sbin/sslh --foreground --listen 0.0.0.0:80 --http 127.0.0.1:8080 --ssh 127.0.0.1:22 --timeout 2
autostart=true
autorestart=true
stdout_logfile=/var/log/sslh.out.log
stderr_logfile=/var/log/sslh.err.log
priority=35

[program:nextjs]
; The vulnerable admin panel runs as ROOT and binds to localhost only.
; This is the intended privesc target (CVE-2025-55182 / React2Shell).
command=/usr/local/bin/node /opt/flightdeck-admin/node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000
directory=/opt/flightdeck-admin
user=root
environment=NODE_ENV="production",HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
stdout_logfile=/var/log/nextjs.out.log
stderr_logfile=/var/log/nextjs.err.log
priority=40
